<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto; }
        h1 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-top: 0; }
        .question-box { margin-bottom: 25px; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; color: #34495e; }
        .choice-label { display: block; background: #f8f9fa; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #e9ecef; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .choice-label:hover { background: #e9ecef; border-color: #ced4da; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); vertical-align: middle; }
        button { background: #3498db; color: white; border: none; padding: 12px 25px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: background 0.2s; }
        button:hover { background: #2980b9; }
        #result-box { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Online Exam Portal</h1>
        <div id="exam-area">
            <div class="question-box">
                <div id="question" class="question-text">Loading question from AWS...</div>
                <div id="choices"></div>
            </div>
            <button id="submit-btn" onclick="submitAnswer()">Submit Answer</button>
        </div>
        <div id="result-box"></div>
    </div>

    <script>
        let currentQuestionId = "1";
        
        // 🔴 CRITICAL ROUTING MAPPING: Connects straight to your real public AWS Fargate Load Balancer router
        const API_BASE = "http://amazonaws.com";

        async function fetchQuestion() {
            try {
                const response = await fetch(`${API_BASE}/api/exam`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const q = data[0];
                    currentQuestionId = q.id;
                    document.getElementById('question').innerText = q.question;
                    
                    let choicesHtml = '';
                    q.choices.forEach(choice => {
                        choicesHtml += `
                            <label class="choice-label">
                                <input type="radio" name="exam-choice" value="${choice}"> ${choice}
                            </label>
                        `;
                    });
                    document.getElementById('choices').innerHTML = choicesHtml;
                }
            } catch (err) {
                document.getElementById('question').innerText = "Failed to load exam questions from cloud infrastructure.";
                console.error(err);
            }
        }

        async function submitAnswer() {
            const selected = document.querySelector('input[name="exam-choice"]:checked');
            const resultBox = document.getElementById('result-box');
            
            if (!selected) {
                resultBox.style.display = 'block';
                resultBox.className = 'error';
                resultBox.innerText = 'Please select an option before submitting!';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/exam/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: currentQuestionId, user_answer: selected.value })
                });
                const result = await response.json();
                
                resultBox.style.display = 'block';
                if (result.passed) {
                    resultBox.className = 'success';
                    resultBox.innerText = `🎉 ${result.msg}`;
                    document.getElementById('submit-btn').disabled = true;
                } else {
                    resultBox.className = 'error';
                    resultBox.innerText = `❌ ${result.msg}. Try again!`;
                }
            } catch (err) {
                resultBox.style.display = 'block';
                resultBox.className = 'error';
                resultBox.innerText = 'Error submitting answer to cloud server.';
            }
        }

        window.onload = fetchQuestion;
    </script>
</body>
</html>
